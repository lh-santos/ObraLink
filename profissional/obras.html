
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras | ObraLink</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="marca">
            <img src="icones/logo.png" alt="Logo ObraLink">
            <h1>ObraLink</h1>
        </a>

        <nav>
            <a href="index.html" class="link">Início</a>
            <a href="header-links/historico.html" class="link">Histórico</a>
            <a href="header-links/status.html" class="link">Meu status</a>
            <a href="header-links/perfil.html" class="link">Perfil</a>
        </nav>
    </header>

    <main class="contener-main">
        <h2 class="titulo-pagina">Obras</h2>

        <section class="contener pagina-unica">
            <form id="formObra" class="formulario">
                <h3>Cadastrar obra</h3>

                <label for="obraNome">Nome da obra</label>
                <input type="text" id="obraNome" placeholder="Ex: Reforma da cozinha" required>

                <label for="obraCliente">Cliente</label>
                <select id="obraCliente" required>
                    <option value="">Selecione um cliente</option>
                </select>

                <label for="obraPrazo">Prazo de conclusão</label>
                <input type="date" id="obraPrazo" required>

                <button type="submit" class="btn">Cadastrar obra</button>
            </form>
        </section>

        <section class="contener cards" id="listaObras"></section>
    </main>
</body>
</html>
