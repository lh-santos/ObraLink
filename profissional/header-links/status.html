<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu status | ObraLink</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../icones/favicon-32x32.png">
</head>
<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../icones/logo.png" alt="Logotipo do ObraLink">
            <h1>ObraLink</h1>
        </a>
        <span class="area-chip">Área do profissional</span>

        <nav aria-label="Navegação principal">
            <a href="../index.html" class="link">Início</a>
            <a href="historico.html" class="link">Histórico</a>
            <a href="status.html" class="link" aria-current="page">Meu status</a>
            <a href="perfil.html" class="link">Perfil</a>
        </nav>
    </header>

    <main class="contener-main">
        <div class="cabecalho-pagina">
            <h2 class="titulo-pagina">Meu status</h2>
            <p class="subtitulo-pagina">Informe se você está disponível para novas obras.</p>
        </div>

        <section class="contener pagina-unica">
            <article class="card status-card">
                <h3>Disponibilidade profissional</h3>

                <div class="status-linha">
                    <p>Seu status atual:</p>
                    <span id="statusProfissional" class="status"></span>
                </div>

                <p class="info">Use o botão abaixo para alternar entre disponível e trabalhando.</p>

                <button type="button" id="alterarStatus" class="btn">
                    Alterar status
                </button>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ObraLink. Todos os direitos reservados.</p>
    </footer>

    <script src="../script.js" defer></script>
</body>
</html>
