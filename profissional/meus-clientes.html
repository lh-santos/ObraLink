<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus clientes | ObraLink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="icones/favicon-32x32.png">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="icones/logo.png" alt="Logotipo do ObraLink">
            <h1>ObraLink</h1>
        </a>
        <span class="area-chip">Área do profissional</span>

        <nav aria-label="Navegação principal">
            <a href="index.html" class="link">Início</a>
            <a href="header-links/historico.html" class="link">Histórico</a>
            <a href="header-links/status.html" class="link">Meu status</a>
            <a href="header-links/perfil.html" class="link">Perfil</a>
        </nav>
    </header>

    <main class="contener-main">
        <h2 class="titulo-pagina">Meus clientes</h2>
        <p class="subtitulo-pagina">Clientes com obras em aberto</p>

        <section class="contener pagina-unica">
            <form id="formCliente" class="formulario">
                <h3>Cadastrar cliente</h3>

                <label for="clienteNome">Nome</label>
                <input type="text" id="clienteNome" placeholder="Nome do cliente" required>

                <label for="clienteTelefone">Telefone</label>
                <input type="tel" id="clienteTelefone" placeholder="(75) 99999-9999" required>

                <button type="submit" class="btn">Cadastrar cliente</button>
            </form>
        </section>

        <section class="contener cards" id="listaClientes"></section>
    </main>

    <footer>
        <p>&copy; 2026 ObraLink. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
