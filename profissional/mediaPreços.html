
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média de preços | ObraLink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="icones/favicon-32x32.png">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="marca">
            <img src="icones/logo.png" alt="Logo ObraLink">
            <h1>ObraLink</h1>
        </a>

        <nav>
            <a href="index.html" class="link">Início</a>
            <a href="header-links/historico.html" class="link">Histórico</a>
            <a href="header-links/status.html" class="link">Meu status</a>
            <a href="header-links/perfil.html" class="link">Perfil</a>
        </nav>
    </header>

    <main class="contener-main">
        <h2 class="titulo-pagina">Média de preços</h2>

        <section class="contener pagina-unica">
            <button type="button" id="addP" class="btn"
                onclick="document.getElementById('formPreco').hidden = false">
                Adicionar serviço
            </button>

            <form id="formPreco" class="formulario" hidden>
                <h3>Informações do serviço</h3>

                <label for="itemNome">Nome do serviço</label>
                <input type="text" id="itemNome" placeholder="Ex: Rebocar" required>

                <label for="itemUnidade">Unidade de medida</label>
                <select id="itemUnidade" required>
                    <option value="m²">Metro quadrado (m²)</option>
                    <option value="m">Metro (m)</option>
                    <option value="unidade">Unidade</option>
                    <option value="hora">Hora</option>
                    <option value="diária">Diária</option>
                </select>

                <label for="itemPreco">Preço em reais (R$)</label>
                <input type="number" id="itemPreco" min="0" step="0.01" placeholder="0,00" required>

                <div class="bntadd">
                    <button type="submit" class="btn">Salvar</button>
                    <button type="button" class="btn"
                        onclick="document.getElementById('formPreco').hidden = true">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <p id="resumo" class="subtitulo-pagina"></p>

        <section class="contener tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Serviço</th>
                        <th>Unidade</th>
                        <th>Preço</th>
                        <th>Média</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPrecos"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
