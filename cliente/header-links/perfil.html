<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | ObraLink</title>
    <link rel="stylesheet" href="../../profissional/css/style.css">
    <link rel="icon" type="image/png" href="../icones/favicon-32x32.png">
</head>
<body>
    <header>
        <a href="../index.html" class="logo">
            <img src="../icones/08560e44-7619-4032-a3a6-54a197e1a773.png" alt="Logotipo do ObraLink">
            <h1>ObraLink</h1>
        </a>
        <span class="area-chip">Área do cliente</span>
        <nav aria-label="Navegação principal">
            <a href="../index.html" class="link">Início</a>
            <a href="historico.html" class="link">Histórico</a>
            <a href="perfil.html" class="link" aria-current="page">Perfil</a>
        </nav>
    </header>

    <main class="contener-main">
        <div class="cabecalho-pagina">
            <h2 class="titulo-pagina">Meu perfil</h2>
            <p class="subtitulo-pagina">Consulte e atualize suas informações.</p>
        </div>

        <form class="formulario" id="formPerfil">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" minlength="3" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" readonly>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" required>

            <button type="submit" class="btn" id="btnSalvar">Salvar alterações</button>
            <p id="mensagemPerfil" role="status" aria-live="polite"></p>
        </form>
    </main>

    <footer><p>&copy; 2026 ObraLink. Todos os direitos reservados.</p></footer>
    <script type="module" src="../js/perfil.js"></script>
    <script type="module" src="../proteger.js"></script>
</body>
</html>
